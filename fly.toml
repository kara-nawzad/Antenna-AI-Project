app = "antenna-ai-project"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  HF_REPO = "kara-nawzad/antenna-models"
  TF_CPP_MIN_LOG_LEVEL = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "300s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/_stcore/health"

[[vm]]
  size = "shared-cpu-1x"
  # 1gb -> 2gb. TensorFlow CPU plus a 115 MB Keras model plus pandas/matplotlib did
  # not fit in 1 GB; the app was being OOM-killed and restarting, which is why every
  # visit paid a full cold start even with min_machines_running = 1. The duplicate
  # model load is now gone too, so 2 GB has real headroom. Costs roughly +$5/month.
  memory = "2gb"
